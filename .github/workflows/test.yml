name: tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: |
          # The default addopts (-m 'not slow and not live') excludes tests that
          # need real tools or network. The tool-wrapper layer is covered by the
          # mock-based test_wrappers_*.py, which DO run here. Tier tests are
          # ignored by filename (they need a fuller environment).
          pytest tests/ -q \
            --ignore=tests/test_tier1.py \
            --ignore=tests/test_tier2.py \
            --ignore=tests/test_tier3.py
